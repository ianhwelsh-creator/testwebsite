<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Slider | E-Commerce Website</title>

  <!-- Favicon -->
  <link rel="icon" href="https://yt3.ggpht.com/a/AGF-l78km1YyNXmF0r3-0CycCA0HLA_i6zYn_8NZEg=s900-c-k-c0xffffffff-no-rj-mo" type="image/png" />

  <!-- Slick Carousel CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css" />

  <!-- Custom CSS -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
    }

    #containerSlider {
      width: 90%;
      max-width: 1200px;
      margin: 100px auto;
    }

    .slider img {
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: 10px;
    }

    /* Responsive image height */
    @media (max-width: 768px) {
      .slider img {
        height: 300px;
      }
    }

    @media (max-width: 480px) {
      .slider img {
        height: 200px;
      }
    }
  </style>
</head>

<body>

  <section id="containerSlider">
    <div class="slider">
      <div><img src="img/img1.png" alt="Image 1" loading="lazy" /></div>
      <div><img src="img/img2.png" alt="Image 2" loading="lazy" /></div>
      <div><img src="img/img3.png" alt="Image 3" loading="lazy" /></div>
      <div><img src="img/img4.png" alt="Image 4" loading="lazy" /></div>
    </div>
  </section>

  <!-- jQuery (HTTPS version) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Slick Carousel JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>

  <!-- Initialize Slick -->
  <script>
    $(document).ready(function () {
      $('.slider').slick({
        dots: true,
        arrows: true,
        infinite: true,
        speed: 500,
        fade: false,
        cssEase: 'ease',
        autoplay: true,
        autoplaySpeed: 2500,
        responsive: [
          {
            breakpoint: 768,
            settings: {
              arrows: false
            }
          }
        ]
      });
    });
  </script>

</body>
</html>
